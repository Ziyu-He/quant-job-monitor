name: job-monitor

on:
  schedule:
    - cron: '17 14 * * *'     # primary: 14:17 UTC (~10:17 ET) — off the top-of-hour to dodge GH scheduler congestion
    - cron: '30 18 * * *'     # fallback: 18:30 UTC — reruns if primary was dropped; last_email_date dedup prevents double email
  workflow_dispatch:           # manual trigger

permissions:
  contents: write              # allow the Commit-state step to git push back

concurrency:
  group: job-monitor           # never run two at once (state commit safety)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor (concurrent)
        env:
          USE_STATIC_COMPANIES: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python monitor_concurrent.py

      - name: Commit updated state
        if: always()             # persist state even if the run errors partway
        run: |
          git config user.name  "job-monitor-bot"
          git config user.email "job-monitor-bot@users.noreply.github.com"
          git add -A state/
          git commit -m "state update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no state changes"
          git push
